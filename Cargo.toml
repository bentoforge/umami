[package]
name = "umami"
version = "0.1.0"
edition = "2024"
description = "micro-IAM: identity, tenant and token-issuance service built on wasabi"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bentoforge/umami"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
# Framework. Local path while the Accept-Language locale negotiation lands in wasabi; switch back to
# the released tag once it is cut (see the commented line — bump the tag past 3.7.0).
wasabi = { path = "../../0711sw/wasabi", features = ["aws_dynamodb", "aws_s3"] }
#wasabi = { git = "https://github.com/bentoforge/wasabi", tag = "3.7.0", features = ["aws_dynamodb", "aws_s3"] }

dotenvy = "0.15"
tokio = { version = "1.48", features = ["full"] }
# warp 0.4 / hyper 1.x — must match wasabi-core so a single warp version unifies.
warp = { version = "0.4", features = ["server"] }
# Query-value encoding for the authorize redirect. Already in the tree via warp/url,
# so declaring it directly adds a name, not a dependency.
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
# Renders umami's *own* mails — the catalogue texts and the deployment's footer. A Jinja2 subset
# that costs exactly one new leaf crate (memo-map; serde is already here), which is less than the
# crates that only substitute `{key}`. An app's own layouts are the worker's business, not this.
minijinja = "2"
chrono = { version = "0.4", features = ["serde"] }
# Exact decimals for money/limits (never f64). Matches dbx-core's setting.
rust_decimal = { version = "1.37", features = ["serde-arbitrary-precision"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"

# default-features = false + default-https-client keeps the crypto/TLS stack aligned with
# wasabi-core (rustls 0.23, not the legacy rustls 0.21 CVE path). cargo unions features per
# crate version, so this MUST match wasabi-core's setting.
aws-sdk-dynamodb = { version = "1.98", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Outbound transactional mail leaves umami as a single SQS write — a worker owns the actual sending.
# Same feature flags as the DynamoDB client so cargo unions to one crypto/TLS stack (see CLAUDE.md).
aws-sdk-sqs = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# The direct transport: umami calls SES itself, for a deployment too small to be worth a worker.
# Feature flags as above.
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
# Same version/feature set wasabi-core uses, so the AWS config layer resolves once.
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
# One call — sts:GetCallerIdentity — answers "is AWS usable here?" at boot, which is what decides
# whether an AWS-backed provider may auto-select (see src/boot/aws.rs). It needs no IAM permission,
# so probing cannot lock out a least-privilege deployment. Feature flags as above.
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }

# ── auth core ─────────────────────────────────────────────────────────────────
argon2 = "0.5"                 # password hashing (argon2id)
# ES256 signing — features = ["aws_lc_rs"] to match wasabi-core's crypto backend.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
p256 = { version = "0.13", features = ["jwk", "pem"] }  # derive the public JWK for the JWKS endpoint
rand = "0.9"                   # refresh-secret generation
sha2 = "0.10"                  # refresh-secret hashing
hmac = "0.12"                  # API-key "Mode 2" HMAC proof-of-possession
subtle = "2.6"                 # constant-time secret comparison
lru = "0.18"                   # bounded per-node LRU cache of known rate-limit blocks
base64 = "0.22"
cookie = "0.18"                # HttpOnly refresh cookie build/parse
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }  # TOTP MFA
qrcode = { version = "0.14", default-features = false, features = ["svg"] }  # QR for TOTP enrolment (SVG only, no image deps)
aes-gcm = "0.10"               # encrypt the TOTP secret at rest (AES-256-GCM)
# WebAuthn/FIDO2 (passkeys + hardware keys). The state-serialisation feature lets us persist the
# short-lived ceremony state server-side (in a TTL'd table) between start and finish.
# `conditional-ui` unlocks the discoverable-credential ceremony (passkey autofill).
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
    "conditional-ui",
] }
rust-i18n = "4.2.1"

[dev-dependencies]
mockall = "0.14"
# `warp::test` lives behind the "test" feature in warp 0.4.
warp = { version = "0.4", features = ["test"] }
# Software authenticator to drive WebAuthn ceremonies headlessly in tests.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

[features]
default = []
pretty_logs = ["wasabi/pretty_logs"]
open_telemetry = ["wasabi/open_telemetry"]
