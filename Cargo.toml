[package]
name = "umami"
version = "0.1.0"
edition = "2024"
description = "micro-IAM: identity, tenant and token-issuance service built on wasabi"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
# Framework. Pinned to a released tag; local path kept for reference during dev.
#wasabi = { path = "../../0711sw/wasabi", features = ["aws_dynamodb"] }
wasabi = { git = "https://github.com/0711sw/wasabi", tag = "2.6.0", features = ["aws_dynamodb"] }

dotenvy = "0.15"
tokio = { version = "1.48", features = ["full"] }
warp = "0.3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"

# default-features = false + default-https-client keeps the crypto/TLS stack aligned with
# wasabi-core (rustls 0.23, not the legacy rustls 0.21 CVE path). cargo unions features per
# crate version, so this MUST match wasabi-core's setting.
aws-sdk-dynamodb = { version = "1.98", default-features = false, features = ["default-https-client", "rt-tokio"] }

# ── auth core (added as phases consume them) ──────────────────────────────────
# Phase 2: argon2 (password), jsonwebtoken (ES256 signing — features = ["aws_lc_rs"] to match
#          wasabi-core), rand + sha2 + base64 (refresh secrets), cookie.
# Phase 5: totp-rs, webauthn-rs.

[dev-dependencies]
mockall = "0.14"

[features]
default = []
pretty_logs = ["wasabi/pretty_logs"]
open_telemetry = ["wasabi/open_telemetry"]
