name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # 1. TS client lib → build, lint, typecheck, publish to npm at the tag version.
  ts-lib:
    name: Publish TS client lib
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing (no NPM_TOKEN needed)
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 22 still ships npm 10.x.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npx biome ci
      - run: npm run typecheck
      - run: npm run build
      - name: Set version from tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      # No NODE_AUTH_TOKEN: npm exchanges the OIDC token with the registry and
      # attaches build provenance automatically for a configured trusted publisher.
      - name: Publish (OIDC Trusted Publishing)
        run: npm publish --access public

  # 2. Management UI → build, lint, typecheck (build again inside the image later).
  ui:
    name: Verify UI
    needs: ts-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the TS client lib
        working-directory: clients/typescript
        run: npm ci && npm run build
      - working-directory: clients/ui
        run: npm ci && npx biome ci && npm run typecheck && npm run build

  # 3. Rust → fmt, clippy, test, audit (the release compile happens in the Docker build).
  rust:
    name: Verify Rust
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-rust

  # 4. Docker → build the self-contained image (UI baked in) and push to GHCR.
  #
  # Multi-arch, one native runner per architecture. The image is consumed by
  # Fargate services on ARM64 (cheaper, and what the noonu fleet runs) and by
  # x86 hosts elsewhere, so dropping either would break somebody. Cross-building
  # under QEMU is not an option here: the release profile compiles the whole Rust
  # tree, and emulated that takes tens of minutes.
  #
  # Each runner pushes an untagged manifest **by digest**; the merge job below
  # assembles the tag from those digests. That is the documented buildx pattern
  # for split-runner multi-arch builds — a shared tag pushed twice would simply
  # overwrite itself, leaving whichever arch finished last.
  docker:
    name: Build image (${{ matrix.arch }})
    needs: rust
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes: one shared scope would have the two runners
          # evicting each other's layers on every release.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # 5. Assemble the multi-arch manifest and give it the release tags.
  manifest:
    name: Publish manifest
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the manifest list
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          refs=""
          for f in /tmp/digests/*; do
            refs="$refs ${IMAGE}@$(cat "$f")"
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            $refs
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
