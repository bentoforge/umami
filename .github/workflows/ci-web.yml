name: CI (Web)

on:
  push:
    branches: [main]
    paths:
      - "clients/**"
      - "biome.json"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "clients/**"
      - "biome.json"

jobs:
  ts-lib:
    name: TS client lib (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm ci
      - run: npx biome ci
      - run: npm run typecheck
      - run: npm run build

  ui:
    name: Management UI (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The UI imports the TS lib via file:../typescript — build the lib first so it resolves.
      - name: Build the TS client lib
        working-directory: clients/typescript
        run: npm ci && npm run build
      - name: Install UI deps
        working-directory: clients/ui
        run: npm ci
      - name: Lint
        working-directory: clients/ui
        run: npx biome ci
      - name: Typecheck
        working-directory: clients/ui
        run: npm run typecheck
      - name: Build
        working-directory: clients/ui
        run: npm run build
