<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/app/favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umami</title>
    <!-- Default accent (space-separated RGB channels). Declared first so /app/branding.css, linked
         last, can override it at runtime. -->
    <style>
      :root {
        --brand: 79 70 229;
        --brand-dark: 67 56 202;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Runtime white-labeling served by umami from the config `branding` block (empty by default). -->
    <link rel="stylesheet" href="/app/branding.css" />
  </body>
</html>
