<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umami</title>
    <!-- Default accent (space-separated RGB channels). Declared first so /app/branding.css, linked
         last, can override it at runtime. -->
    <style>
      :root {
        /* CI accent #AD1E6B (see /ci/CI.md); overridable via config branding.customCss. */
        --brand: 173 30 107;
        --brand-dark: 138 24 86;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Runtime white-labeling served by umami from the config `branding` block (empty by default). -->
    <link rel="stylesheet" href="%BASE_URL%branding.css" />
  </body>
</html>
