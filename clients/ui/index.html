<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>umami</title>
    <!-- Default accent (space-separated RGB channels). Declared first so /app/branding.css, linked
         last, can override it at runtime. -->
    <style>
      :root {
        /* Primary = functional action color (buttons/focus/selection): a serious blue (#2563EB). */
        --primary: 37 99 235;
        --primary-dark: 29 78 216;
        /* Brand = identity accent, used sparingly (CI #AD1E6B, see /ci/CI.md). */
        --brand: 173 30 107;
        --brand-dark: 138 24 86;

        /* Header chrome. Four knobs so a deployment can put its own bar up top
           without fighting the cascade: the nav items carry their own colours, so
           a `color` on <header> is never inherited and never applies.
           Defaults reproduce the stock look. */
        --header-bg: 255 255 255;       /* white */
        --header-text: 71 85 105;         /* slate-600 — nav text and icons, hovered */
        --header-text-muted: 100 116 139; /* slate-500 — inactive nav items */
        --header-hover: 241 245 249;    /* slate-100 — hovered item background */
        --header-accent: var(--brand);  /* the active item — follows the brand unless set */
        --header-border: 226 232 240;   /* slate-200 — the rule below the bar */

        /* Sign-in screen. The first thing anyone sees, and for a customer's users
           often the only umami page they ever look at. */
        --login-bg: 241 245 249;           /* slate-100 — behind the card */
        --login-card: 255 255 255;      /* the card itself */
        --login-text: 15 23 42;              /* slate-900 — heading and labels */
        --login-primary: var(--primary);   /* the submit button */
        --login-primary-text: 255 255 255;   /* its label */
        --login-secondary: 203 213 225;    /* slate-300 — the outline button's border */
        --login-secondary-text: 51 65 85;    /* slate-700 — its label */
      }

      /* Dark-mode defaults only. A deployment that overrides the tokens in :root
         and stops there gets one bar in both modes — which is usually the point of
         putting a logo up there. */
      .dark {
        --header-bg: 30 41 59;          /* slate-800 */
        --header-text: 203 213 225;       /* slate-300 */
        --header-text-muted: 148 163 184; /* slate-400 */
        --header-hover: 51 65 85;       /* slate-700 */
        --header-border: 51 65 85;      /* slate-700 */

        --login-bg: 15 23 42;              /* slate-900 */
        --login-card: 30 41 59;         /* slate-800 */
        --login-text: 255 255 255;
        --login-secondary: 71 85 105;      /* slate-600 */
        --login-secondary-text: 226 232 240; /* slate-200 */
      }
      /* Both are overridable at runtime via config branding.customCss (loaded last). */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- The favicon + branding stylesheet (umami's config `branding` block) are wired at runtime in
         main.tsx with an absolute BASE_URL path — a static <link> here would be doubled to
         /app/app/… by Vite's dev server. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
